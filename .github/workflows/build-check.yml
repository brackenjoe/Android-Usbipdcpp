# 提交与 PR 的编译验证：只构建 debug，不发布任何产物
name: Build Check

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04
    env:
      # 让 Gradle 在 setup-java 装好的 JDK 21 里找 daemon 用的 JVM
      GRADLE_OPTS: -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64

    steps:
      - name: 检出代码（含子模块）
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: 校验 Gradle wrapper jar
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: 校验 JNI 错误码与 Kotlin 镜像一致
        run: |
          # ErrorCode 是跨语言镜像（C++ 值经 JNI 原样传给 Kotlin），两边注释
          # 互相提醒但编译期发现不了漏改，这里做静态比对。提取限定在各自的
          # ErrorCode 定义块内：文件里新增其他常量不会被误抓。块内行格式若
          # 改变需要同步调整正则；提取为空会直接失败而不是静默通过
          cpp=$(awk '/^namespace ErrorCode \{/,/^\}/' app/src/main/cpp/usbipd_jni.cpp \
            | grep -oE 'constexpr int [A-Z_]+ = [0-9]+' | sed 's/constexpr int //' | sort)
          kotlin=$(awk '/object ErrorCode \{/,/^\s*\}/' app/src/main/java/com/yunsmall/usbipdcpp/UsbIpNative.kt \
            | grep -oE 'const val [A-Z_]+ = [0-9]+' | sed 's/const val //' | sort)
          if [ -z "$cpp" ] || [ -z "$kotlin" ]; then
            echo "::error::ErrorCode 提取为空（定义块格式疑似变化，检查本步的正则）"
            exit 1
          fi
          if [ "$cpp" != "$kotlin" ]; then
            echo "::error::ErrorCode 两侧不一致（左 C++，右 Kotlin）："
            diff <(echo "$cpp") <(echo "$kotlin") || true
            exit 1
          fi
          echo "ErrorCode 一致：$(echo "$cpp" | grep -c '=') 项"

      - name: 设置 JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          # 17 起 Gradle（JAVA_HOME 取列表最后一个，故 17 放后面）；
          # gradle-daemon-jvm.properties 要求 21 的 daemon，装好以免 Gradle 去下载
          java-version: |
            21
            17
          distribution: 'temurin'

      - name: 安装 NDK 29.0.14033849
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14033849" 2>/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14033849" >> $GITHUB_ENV

      - name: 设置 vcpkg
        run: |
          # 固定在 vcpkg.json 的 builtin-baseline 那个提交（不再跟随 master）：
          # 先 init 再按提交号浅取，只下载这一个提交
          VCPKG_COMMIT=$(jq -r '."builtin-baseline"' app/src/main/cpp/vcpkg.json)
          if ! printf '%s' "$VCPKG_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::vcpkg.json 的 builtin-baseline 不是 40 位十六进制提交号: $VCPKG_COMMIT"
            exit 1
          fi
          git init -q "$HOME/vcpkg"
          git -C "$HOME/vcpkg" fetch -q --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_COMMIT"
          git -C "$HOME/vcpkg" checkout -q FETCH_HEAD
          echo "VCPKG_COMMIT=$VCPKG_COMMIT" >> "$GITHUB_ENV"
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"
          # manifest 模式（vcpkg.json + CMAKE_TOOLCHAIN_FILE）下依赖走二进制缓存，
          # 默认落在 ~/.cache/vcpkg/archives；显式指定固定目录，缓存路径才可控
          # （~/vcpkg/packages、~/vcpkg/buildtrees 只有经典模式 install 才用，这里是空的）
          mkdir -p "$HOME/vcpkg-binary-cache"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$HOME/vcpkg-binary-cache" >> "$GITHUB_ENV"

      - name: 缓存 Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/*.gradle', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-

      - name: 缓存 vcpkg 二进制缓存
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # 此处配置需与 release.yml、build-apk.yml 完全一致，三处共享同一份缓存
          path: ~/vcpkg-binary-cache
          key: vcpkg-bincache-${{ env.VCPKG_COMMIT }}-${{ hashFiles('app/src/main/cpp/vcpkg.json') }}
          restore-keys: vcpkg-bincache-${{ env.VCPKG_COMMIT }}-

      - name: 安装构建工具（vcpkg libusb 需要 autotools）
        run: sudo apt-get install -y autoconf autoconf-archive automake libtool

      - name: 编译 Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 校验 APK 权限白名单
        run: bash .github/scripts/check-permissions.sh app/build/outputs/apk/debug/app-debug.apk

      - name: 上传 Debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # 编译已经花了几分钟，导出产物只需几秒；带 sha 便于区分是哪次提交的
          name: usbipdcpp-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
