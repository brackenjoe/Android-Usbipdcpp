# Fork: submits the Gradle dependency graph so Dependabot alerts cover it.
# GitHub's automatic submission cannot install NDK 29 or accept its licence,
# so it fails configuring :app; this job repeats Build Check's setup instead.
# Turn automatic submission off in Settings so the two do not both run.
name: Dependency Submission

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    name: Submit Gradle dependencies
    runs-on: ubuntu-24.04
    env:
      GRADLE_OPTS: -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false

      # This job holds contents: write and runs Gradle: check the wrapper jar
      # first (validate-wrappers is off by default in gradle/actions v4.4.4)
      - name: Validate the Gradle wrapper jar
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up JDK 17 and 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: |
            21
            17
          distribution: 'temurin'

      - name: Install NDK 29.0.14033849
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14033849" 2>/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14033849" >> $GITHUB_ENV

      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
