# 发布 Release APK（手动触发或推送 v* tag 自动触发）
name: Release

on:
  push:
    # This fork's tags only (v0.0.11-dialout.1); upstream's v* tags never publish here
    tags: ["v*-dialout.*"]
  workflow_dispatch:

# 默认只读；只有最后的 publish 作业拿 contents: write
permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # 让 Gradle 在 setup-java 装好的 JDK 21 里找 daemon 用的 JVM
      GRADLE_OPTS: -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64

    steps:
      - name: 检出代码（含子模块）
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: 设置 JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          # 17 起 Gradle（JAVA_HOME 取列表最后一个，故 17 放后面）；
          # gradle-daemon-jvm.properties 要求 21 的 daemon，装好以免 Gradle 去下载
          java-version: |
            21
            17
          distribution: 'temurin'

      - name: 校验 Gradle wrapper jar
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: 提取版本号
        env:
          # tag 名由推送者决定：只经 env 传入，脚本里加引号使用
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          # Only a tag publishes: a manual run from a branch would sign a dev build
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::run this workflow on a release tag (v<version>-dialout.<n>), not a branch"
            exit 1
          fi
          VERSION="${REF_NAME#v}"
          # 版本号会写进 GITHUB_ENV、文件名和 Gradle 参数：只放行普通字符
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9A-Za-z._+-]+$'; then
            echo "::error::版本号含不允许的字符: $VERSION"
            exit 1
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "版本: $VERSION"

      - name: 安装 NDK 29.0.14033849
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14033849" 2>/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14033849" >> $GITHUB_ENV

      - name: 设置 vcpkg
        run: |
          # 固定在 vcpkg.json 的 builtin-baseline 那个提交（不再跟随 master）：
          # 先 init 再按提交号浅取，只下载这一个提交
          VCPKG_COMMIT=$(jq -r '."builtin-baseline"' app/src/main/cpp/vcpkg.json)
          if ! printf '%s' "$VCPKG_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::vcpkg.json 的 builtin-baseline 不是 40 位十六进制提交号: $VCPKG_COMMIT"
            exit 1
          fi
          git init -q "$HOME/vcpkg"
          git -C "$HOME/vcpkg" fetch -q --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_COMMIT"
          git -C "$HOME/vcpkg" checkout -q FETCH_HEAD
          echo "VCPKG_COMMIT=$VCPKG_COMMIT" >> "$GITHUB_ENV"
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"
          # manifest 模式（vcpkg.json + CMAKE_TOOLCHAIN_FILE）下依赖走二进制缓存，
          # 默认落在 ~/.cache/vcpkg/archives；显式指定固定目录，缓存路径才可控
          # （~/vcpkg/packages、~/vcpkg/buildtrees 只有经典模式 install 才用，这里是空的）
          mkdir -p "$HOME/vcpkg-binary-cache"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$HOME/vcpkg-binary-cache" >> "$GITHUB_ENV"

      - name: 缓存 Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/*.gradle', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-

      - name: 缓存 vcpkg 二进制缓存
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # 此处配置需与 build-apk.yml、build-check.yml 完全一致，三处共享同一份缓存
          path: ~/vcpkg-binary-cache
          key: vcpkg-bincache-${{ env.VCPKG_COMMIT }}-${{ hashFiles('app/src/main/cpp/vcpkg.json') }}
          restore-keys: vcpkg-bincache-${{ env.VCPKG_COMMIT }}-

      - name: 解码 keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # 解到 RUNNER_TEMP（工作区之外，不会被后续步骤当作源码打包），仅属主可读
          if [ -n "$KEYSTORE_BASE64" ]; then
            umask 077
            printf '%s\n' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_ENV"
            echo "keystore 已解码"
          else
            echo "::error::KEYSTORE_BASE64 is not set: a release must be signed"
            exit 1
          fi

      - name: 安装构建工具（vcpkg libusb 需要 autotools）
        run: sudo apt-get install -y autoconf autoconf-archive automake libtool

      - name: 编译 APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # versionCode: this workflow's run number only grows (it is counted per
          # workflow file: do not rename release.yml), so each release installs over the last
          ./gradlew assembleRelease -PversionName="$APP_VERSION" -PversionCode="$GITHUB_RUN_NUMBER"

      - name: 删除 keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/keystore.jks"

      - name: 重命名 APK
        run: |
          mkdir -p apks
          # Only a signed release APK is published: an unsigned one cannot be
          # installed, and a debug one has a new key on every build
          release_dir=app/build/outputs/apk/release
          if [ -f "$release_dir/app-release.apk" ]; then
            cp "$release_dir/app-release.apk" "apks/usb-ip-dialout-v${APP_VERSION}.apk"
          elif [ -f "$release_dir/app-release-unsigned.apk" ]; then
            echo "::error::the release APK is unsigned: set KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD"
            exit 1
          else
            echo "::error::$release_dir 下没有 release APK"
            ls -l "$release_dir"
            exit 1
          fi
          ls -lh apks/

      - name: 校验 APK 权限白名单
        run: bash .github/scripts/check-permissions.sh apks/*.apk

      - name: 上传 artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: usbipdcpp-release-apks
          path: apks/*.apk
          if-no-files-found: error

  # 唯一拿到写权限的作业：不检出代码、不执行仓库里的任何脚本，
  # 只取回上面构建好的 APK 交给发布 action
  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: 取回 APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: usbipdcpp-release-apks
          path: apks

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: apks/*.apk
          generate_release_notes: true
          # 默认发布为 pre-release，验证没问题后手动改为正式 release
          prerelease: true
